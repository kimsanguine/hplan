<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRD Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { background: #0f1117; }</style>
</head>
<body class="min-h-screen text-slate-100 font-sans">

  <div class="max-w-6xl mx-auto p-6 space-y-6">

    <!-- 제목 -->
    <h1 id="doc-title" class="text-2xl font-black text-white"></h1>

    <!-- 상태 바: 3 gate indicators -->
    <div id="status-bar" class="flex flex-wrap gap-3"></div>

    <div class="flex gap-6">

      <!-- 사이드바 네비게이션 -->
      <aside class="w-52 shrink-0">
        <p class="text-xs text-slate-400 uppercase tracking-widest mb-3 font-semibold">목차</p>
        <nav id="section-nav" class="space-y-1"></nav>
      </aside>

      <!-- 본문 + Mermaid -->
      <div class="flex-1 min-w-0 space-y-6">

        <!-- Mermaid 다이어그램 (mermaid_code가 있을 때만) -->
        <div id="mermaid-container" class="hidden bg-slate-800/60 border border-slate-700/50 rounded-2xl p-6">
          <p class="text-xs text-slate-400 uppercase tracking-widest mb-4">JTBD Diagram</p>
          <pre id="mermaid-diagram" class="mermaid"></pre>
        </div>

        <!-- 본문 (marked.js) -->
        <div id="content" class="prose prose-invert max-w-none"></div>

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script>
    const DATA = __DATA_JSON__;

    // ── 제목 ──────────────────────────────────────────────
    document.getElementById('doc-title').textContent = DATA.title || 'PRD';

    // ── 상태 바 ───────────────────────────────────────────
    function scoreColor(score) {
      if (score >= 75) return { bg: 'bg-emerald-500/20', border: 'border-emerald-500/40', text: 'text-emerald-300' };
      if (score >= 55) return { bg: 'bg-amber-500/20',   border: 'border-amber-500/40',   text: 'text-amber-300' };
      return                   { bg: 'bg-red-500/20',    border: 'border-red-500/40',    text: 'text-red-300' };
    }

    function cogsColor(verdict) {
      if (verdict === 'GREEN')          return { bg: 'bg-emerald-500/20', border: 'border-emerald-500/40', text: 'text-emerald-300' };
      if (verdict === 'CONDITIONAL_GO') return { bg: 'bg-amber-500/20',   border: 'border-amber-500/40',   text: 'text-amber-300' };
      return                                   { bg: 'bg-red-500/20',    border: 'border-red-500/40',    text: 'text-red-300' };
    }

    function gateColor(passed) {
      if (passed >= 3) return { bg: 'bg-emerald-500/20', border: 'border-emerald-500/40', text: 'text-emerald-300' };
      if (passed >= 1) return { bg: 'bg-amber-500/20',   border: 'border-amber-500/40',   text: 'text-amber-300' };
      return                   { bg: 'bg-red-500/20',    border: 'border-red-500/40',    text: 'text-red-300' };
    }

    function makeBadge(label, cfg) {
      const el = document.createElement('span');
      el.className = `text-xs font-bold px-3 py-1.5 rounded-full border ${cfg.bg} ${cfg.border} ${cfg.text}`;
      el.textContent = label;
      return el;
    }

    const bar = document.getElementById('status-bar');

    // Evidence score badge
    const score = DATA.evidence_score || 0;
    bar.appendChild(makeBadge(`Evidence ${score}`, scoreColor(score)));

    // COGS verdict badge
    const verdict = DATA.cogs_verdict || '';
    bar.appendChild(makeBadge(`COGS ${verdict || '—'}`, cogsColor(verdict)));

    // Gate state badge
    const stateStr = DATA.state || '';
    const passedNum = parseInt(stateStr.split('/')[0], 10) || 0;
    bar.appendChild(makeBadge(`${passedNum}/3 gates passed`, gateColor(passedNum)));

    // ── 사이드바 네비게이션 ──────────────────────────────────
    const nav = document.getElementById('section-nav');
    (DATA.sections || []).forEach(sec => {
      const a = document.createElement('a');
      a.href = '#' + sec.slug;
      a.className = 'block text-sm text-indigo-400 hover:text-indigo-200 py-0.5 truncate';
      a.textContent = sec.text;
      nav.appendChild(a);
    });

    // ── Mermaid (조건부) ──────────────────────────────────
    if (DATA.mermaid_code) {
      const container = document.getElementById('mermaid-container');
      container.classList.remove('hidden');
      const diagramEl = document.getElementById('mermaid-diagram');
      diagramEl.textContent = DATA.mermaid_code;

      const mermaidScript = document.createElement('script');
      mermaidScript.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
      mermaidScript.onload = function () {
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        mermaid.run({ nodes: [diagramEl] });
      };
      document.head.appendChild(mermaidScript);
    }

    // ── 본문 ──────────────────────────────────────────────
    const contentEl = document.getElementById('content');
    contentEl.innerHTML = marked.parse(DATA.body_md || '');

    // 헤딩에 slug id 추가 (Python _slugify와 동일 로직)
    contentEl.querySelectorAll('h1,h2,h3').forEach(el => {
      let t = el.textContent.toLowerCase();
      t = t.replace(/—/g, '-').replace(/–/g, '-');
      t = t.replace(/ /g, '-');
      t = t.replace(/[^\w가-힣-]/g, '');
      el.id = t;
    });
  </script>
</body>
</html>

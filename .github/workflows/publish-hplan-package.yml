name: Publish hplan Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".claude-plugin/**"
      - "hplan/**"
      - "discover/**"
      - "architect/**"
      - "deliver/**"
      - "operate/**"
      - "hooks/**"
      - "harness/**"
      - "profiles/**"
      - "hplan-core-fixture/**"
      - "hplan-core.lock"
      - "scripts/**"
      - "docs/**"
      - "assets/**"
      - "README.md"
      - "README-ko.md"
      - "GUIDE-ko.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - ".github/workflows/publish-hplan-package.yml"
      - "infra/cloudflare/hplan-installer/**"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare Worker assets
        run: bash scripts/prepare-worker-assets.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: hplan-private-package
          path: dist/

      - name: Deploy Worker with private package assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config infra/cloudflare/hplan-installer/wrangler.toml

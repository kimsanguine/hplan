<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="220" viewBox="0 0 1080 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="220" fill="#ffffff"/>
  <text x="540" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="500">
    Agent Product Lifecycle — 34 skills across 5 plugins
  </text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>
  <!-- hplan (Gate) — Stage 0 -->
  <rect x="130" y="55" width="140" height="100" rx="10" fill="#F87171" stroke="#DC2626" stroke-width="2"/>
  <text x="200" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">hplan ⭐</text>
  <text x="200" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Gate</text>
  <text x="200" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FEE2E2" text-anchor="middle" font-weight="500">8 skills</text>
  <text x="200" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#FEE2E2" text-anchor="middle">Should we build?</text>
  <!-- discover -->
  <rect x="300" y="55" width="140" height="100" rx="10" fill="#6366F1"/>
  <text x="370" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">discover</text>
  <text x="370" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Discovery</text>
  <text x="370" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E0E7FF" text-anchor="middle" font-weight="500">6 skills</text>
  <text x="370" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E0E7FF" text-anchor="middle">What to build?</text>
  <!-- architect -->
  <rect x="470" y="55" width="140" height="100" rx="10" fill="#8B5CF6"/>
  <text x="540" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">architect</text>
  <text x="540" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Architecture</text>
  <text x="540" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#EDE9FE" text-anchor="middle" font-weight="500">4 skills</text>
  <text x="540" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#EDE9FE" text-anchor="middle">How to structure?</text>
  <!-- deliver -->
  <rect x="640" y="55" width="140" height="100" rx="10" fill="#F59E0B"/>
  <text x="710" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">deliver</text>
  <text x="710" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Delivery</text>
  <text x="710" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FEF3C7" text-anchor="middle" font-weight="500">10 skills</text>
  <text x="710" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">How to ship?</text>
  <!-- operate -->
  <rect x="810" y="55" width="140" height="100" rx="10" fill="#10B981"/>
  <text x="880" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">operate</text>
  <text x="880" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Operations</text>
  <text x="880" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#D1FAE5" text-anchor="middle" font-weight="500">6 skills</text>
  <text x="880" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#D1FAE5" text-anchor="middle">How to operate?</text>
  <!-- Arrows -->
  <line x1="270" y1="105" x2="295" y2="105" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="105" x2="465" y2="105" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="105" x2="635" y2="105" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="780" y1="105" x2="805" y2="105" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Feedback loop operate → hplan -->
  <path d="M 880 155 Q 880 200, 540 200 Q 200 200, 200 155" stroke="#9CA3AF" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="540" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">Accumulated TK feeds back into next gate</text>
</svg>
